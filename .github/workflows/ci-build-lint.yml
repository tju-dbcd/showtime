name: CI Pipeline

on:
  push:
    branches: [ main, Develop ]
  pull_request:
    branches: [ main, Develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  # ✅ 修复：使用合法的 32 字节 Base64 密钥（不含 - 号）
  TicketSecurity__SigningKeyBase64: 'dGVzdC1rZXktZm9yLWNpLW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u'

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./**/bin/Release/
          retention-days: 7
          if-no-files-found: warn

  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Run linter
        run: dotnet format --verify-no-changes --verbosity diagnostic

  frontend:
    name: Frontend Build + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: warn

  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./**/TestResults/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: warn

  openapi-check:
    name: OpenAPI Snapshot Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Start backend and export OpenAPI document
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
          TicketSecurity__SigningKeyBase64: ${{ env.TicketSecurity__SigningKeyBase64 }}
        run: |
          dotnet ./bin/Release/net10.0/ShowtimeBackend.dll &
          APP_PID=$!
          GENERATED=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/openapi/v1.json -o "$GITHUB_WORKSPACE/openapi-snapshot.json"; then
              GENERATED=1
              break
            fi
            sleep 2
          done
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          if [ "$GENERATED" != "1" ] || [ ! -s "$GITHUB_WORKSPACE/openapi-snapshot.json" ]; then
            echo "::error::Failed to generate OpenAPI document from /openapi/v1.json."
            exit 1
          fi

      - name: Check OpenAPI snapshot freshness
        id: openapi_check
        run: |
          jq 'del(.servers)' ./openapi-snapshot.json > /tmp/openapi-snapshot.norm.json
          jq 'del(.servers)' ./frontend/src/api/openapi.json > /tmp/openapi-committed.norm.json
          if ! cmp -s /tmp/openapi-snapshot.norm.json /tmp/openapi-committed.norm.json; then
            echo "::error::OpenAPI snapshot is outdated. Regenerate and commit ./frontend/src/api/openapi.json"
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "OpenAPI snapshot is up to date."
          echo "status=pass" >> "$GITHUB_OUTPUT"

      - name: Upload generated OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi-generated
          path: ./openapi-snapshot.json
          retention-days: 3
          if-no-files-found: warn

      - name: OpenAPI Check Result
        if: always()
        run: |
          echo "OpenAPI Check Completed"
          echo "Status: ${{ steps.openapi_check.outputs.status }}"
          if [ "${{ steps.openapi_check.outputs.status }}" == "fail" ]; then
            echo "Please regenerate the OpenAPI snapshot locally and commit it to frontend/src/api/openapi.json."
          fi

  # ============================================================
  # Playwright E2E Tests - 默认跳过，避免污染生产数据
  # 如需启用，将 if 改为: github.event_name == 'pull_request'
  # ============================================================
  e2e-test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, frontend]
    if: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore backend dependencies
        run: dotnet restore

      - name: Build backend
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start services and run E2E tests
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
          TicketSecurity__SigningKeyBase64: ${{ env.TicketSecurity__SigningKeyBase64 }}
        run: |
          echo "=== Starting services ==="

          dotnet --version

          echo "Starting backend..."
          cd backend
          dotnet ./bin/Release/net10.0/ShowtimeBackend.dll &
          BACKEND_PID=$!

          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000 > /dev/null 2>&1; then
              echo "✅ Backend ready (port 5000)"
              break
            fi
            echo "⏳ Backend not ready... $i/30"
            sleep 2
          done

          echo "Starting frontend..."
          cd ../frontend
          npm run dev -- --port 5173 --host 127.0.0.1 &
          FRONTEND_PID=$!

          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null 2>&1; then
              echo "✅ Frontend ready (port 5173)"
              break
            fi
            echo "⏳ Frontend not ready... $i/30"
            sleep 2
          done

          echo "=== Service check ==="
          curl -v http://127.0.0.1:5000 || echo "❌ Backend check failed"
          curl -v http://127.0.0.1:5173 || echo "❌ Frontend check failed"
          echo "=== Running tests ==="

          npx playwright test tests/showtime.spec.ts --reporter=line

          kill $FRONTEND_PID 2>/dev/null || true
          kill $BACKEND_PID 2>/dev/null || true

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright test traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: warn